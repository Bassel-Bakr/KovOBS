<main class="container">
  <mat-toolbar data-tauri-drag-region>
    <h1 data-tauri-drag-region>
      {{ title() }}
    </h1>

    <span class="spacer"></span>

    <div class="window-controls">
      <button matIconButton (click)="minimize()">
        <mat-icon>remove</mat-icon>
      </button>

      <button matIconButton (click)="toggleMaximize()">
        <mat-icon>crop_square</mat-icon>
      </button>

      <button matIconButton color="warn" (click)="close()" (contextmenu)="openQuitMenu($event)">
        <mat-icon>close</mat-icon>
      </button>

      <!-- Anchors the context menu where the pointer was. The trigger cannot be
           the close button itself: that would open the menu on a left click. -->
      <div
        class="quit-anchor"
        [style.left.px]="quitMenuAt().x"
        [style.top.px]="quitMenuAt().y"
        [matMenuTriggerFor]="quitMenu"
      ></div>

      <mat-menu #quitMenu>
        <button mat-menu-item type="button" (click)="quit()">
          <mat-icon>power_settings_new</mat-icon>
          <span>Quit KovOBS</span>
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>

  <div class="router-outlet__container">
    <router-outlet />
  </div>

  @if (globalService.showLogs()) {
    <app-logs />
  }
</main>

# Releases on every push to main that has a feat, fix, perf or breaking commit
# since the last v* tag (scripts/release.py, with cliff.toml's rules), the way
# masar does: tags the commit v<version>, builds the installers on each platform
# with that version stamped into src-tauri/Cargo.toml, and publishes them as the
# GitHub release v<version>. The version lives in the tags, so nothing commits a
# version bump. A tag pushed with GITHUB_TOKEN starts no other workflow, so
# everything happens in this one run.

name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (MAJOR.MINOR.PATCH); empty for the one the commits since the last tag give"
        required: false

permissions:
  contents: write

# One release at a time. A run waits for the one in flight instead of
# cancelling it; GitHub keeps only the newest waiting run, which loses nothing,
# since it releases every commit since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags, to find the last release and the
          # commits since.
          fetch-depth: 0

      # Tags HEAD v<version> and writes version= (empty for no release). A
      # commit that already has its tag (this run again after a failure) keeps
      # it, so the build and the release run again.
      - name: Tag the release
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py --tag "$VERSION"

      - name: Push the tag
        if: steps.tag.outputs.version != ''
        run: git push origin "v${{ steps.tag.outputs.version }}"

  build:
    needs: version
    if: needs.version.outputs.version != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux

          - os: windows-latest
            platform: windows
    #
    #          - os: macos-latest
    #            platform: macos

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      # Caches target/ as one archive per platform, rather than sccache's one
      # Actions-cache entry per compilation unit. sccache had grown to 1,439
      # entries and 5.6 GB of the repo's 10 GB budget, so the entries it needed
      # were being evicted and every restore was thousands of round trips.
      # A restored target/ also means cargo skips the work entirely, instead of
      # invoking rustc and re-running build scripts to hit a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.platform }}

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          # WiX and the AppImage tooling are downloaded on first use and
          # live outside target/, so rust-cache does not cover them.
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
          key: tauri-bundler-${{ runner.os }}-v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            patchelf
          version: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Keyed per OS: node_modules holds platform-specific binaries such
          # as @tauri-apps/cli and esbuild.
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # `python` on every runner; Windows has no `python3`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # src-tauri/Cargo.toml holds a placeholder in git; Tauri reads the version
      # from it.
      - name: Stamp the version
        shell: bash
        run: python scripts/release.py --stamp "$VERSION"

      # A release used to ship on nothing but a successful compile. The crate is
      # already built by this point, so this is seconds.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build
        # Uses the prebuilt CLI that npm ci already installed, rather than
        # compiling tauri-cli from source.
        run: npx tauri build

      - name: Prepare release assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir release-assets

          find target/release/bundle -type f \
            \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" \
            \) \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *; do
            ext="${f##*.}"
            mv "$f" "KovOBS-${{ matrix.platform }}-v${VERSION}.${ext}"
          done

      - name: Prepare release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets | Out-Null

          Get-ChildItem target/release/bundle -Recurse -Include *.msi |
            Copy-Item -Destination release-assets

          Get-ChildItem release-assets | ForEach-Object {
            Rename-Item $_.FullName "KovOBS-windows-v$env:VERSION.msi"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release-assets/*

  release:
    needs:
      - version
      - build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: find . -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            *

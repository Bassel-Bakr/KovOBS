name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use Cargo.toml)"
        required: false

  push:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ]; then
            VERSION=$(cargo metadata \
              --manifest-path src-tauri/Cargo.toml \
              --no-deps \
              --format-version 1 \
              | jq -r '.packages[0].version')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux

          - os: windows-latest
            platform: windows
    #
    #          - os: macos-latest
    #            platform: macos

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build
        run: cargo tauri build

      - name: Prepare release assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir release-assets

          find target/release/bundle -type f \
            \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" \
            \) \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *; do
            ext="${f##*.}"
            mv "$f" "KovOBS-${{ matrix.platform }}-v${VERSION}.${ext}"
          done

      - name: Prepare release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets | Out-Null

          Get-ChildItem target/release/bundle -Recurse -Include *.msi,*setup*.exe |
            Copy-Item -Destination release-assets

          Get-ChildItem release-assets | ForEach-Object {
            if ($_.Extension -eq ".msi") {
              Rename-Item $_.FullName "KovOBS-windows-v$env:VERSION.msi"
            }
            elseif ($_.Name -like "*setup*.exe") {
              Rename-Item $_.FullName "KovOBS-windows-v$env:VERSION-setup.exe"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release-assets/*

  release:
    needs:
      - prepare
      - build

    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: find . -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            *

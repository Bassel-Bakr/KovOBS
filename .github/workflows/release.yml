name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use Cargo.toml)"
        required: false

  push:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ]; then
            # Read straight from the manifest: this job gates the whole
            # matrix, so installing a toolchain just to run `cargo metadata`
            # is latency in front of every build.
            VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux

          - os: windows-latest
            platform: windows
    #
    #          - os: macos-latest
    #            platform: macos

    runs-on: ${{ matrix.os }}

    env:
      # sccache keys on compilation inputs rather than the lockfile, so a
      # version bump no longer invalidates everything.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # sccache handles compiled artifacts; leaving target/ caching on
          # would double-store them and push the 10 GB repo cache into
          # eviction. rust-cache still covers the registry and git deps.
          cache-targets: false

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          # WiX and the AppImage tooling are downloaded on first use and
          # live outside target/, so rust-cache does not cover them.
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
          key: tauri-bundler-${{ runner.os }}-v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            patchelf
          version: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Keyed per OS: node_modules holds platform-specific binaries such
          # as @tauri-apps/cli and esbuild.
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        # Uses the prebuilt CLI that npm ci already installed, rather than
        # compiling tauri-cli from source.
        run: npx tauri build

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare release assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir release-assets

          find target/release/bundle -type f \
            \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" \
            \) \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *; do
            ext="${f##*.}"
            mv "$f" "KovOBS-${{ matrix.platform }}-v${VERSION}.${ext}"
          done

      - name: Prepare release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets | Out-Null

          Get-ChildItem target/release/bundle -Recurse -Include *.msi |
            Copy-Item -Destination release-assets

          Get-ChildItem release-assets | ForEach-Object {
            Rename-Item $_.FullName "KovOBS-windows-v$env:VERSION.msi"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release-assets/*

  release:
    needs:
      - prepare
      - build

    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: find . -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            *

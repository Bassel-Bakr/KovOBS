name: Checks

# Nothing used to run on a pull request, so tests gated nothing and a branch
# could merge red. This runs the checks; release.yml still builds and ships.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux

          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Same key as release.yml, so both share one archive per platform.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            patchelf
          version: 1

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        # Not `-D warnings`: one pre-existing warning in
        # aimbeast/scenario_statistics.rs would fail every run. Errors still fail.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The tests above rewrite the generated frontend types as a side effect.
      # If that leaves a diff, the committed files were stale.
      - name: Generated types are current
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! git diff --exit-code -- src/app/models; then
            echo "::error::Generated config types are stale. Run 'npm run generate' and commit the result."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npx ng build

# The rules a release's version follows, in git-cliff's terms, so
# `git cliff --bumped-version` agrees with scripts/release.py, which applies the
# same rules itself (CI needs no git-cliff). The changelog itself comes from
# GitHub's generate_release_notes. Same rules as masar.

[changelog]
header = ""
body = ""
trim = true

[git]
conventional_commits = true
filter_commits = true
topo_order = false
sort_commits = "oldest"
# A breaking change releases whatever its type.
protect_breaking_commits = true
tag_pattern = "v[0-9].*"

# Only these types release. Everything else is skipped, so a docs- or
# chore-only push releases nothing.
commit_parsers = [
  { message = "^feat", group = "features" },
  { message = "^fix", group = "fixes" },
  { message = "^perf", group = "fixes" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
# Before 1.0 a breaking change bumps the minor version; from 1.0 on, the major.
breaking_always_bump_major = false
# The first release, with no tag before it.
initial_tag = "0.1.0"

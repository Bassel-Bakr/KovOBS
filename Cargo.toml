[workspace]
members = [".", "src-tauri"]
resolver = "3"

# Debug info is what the linker spends most of its time on here, so
# dependencies get none -- they are never stepped into, and that is where most
# of the saving is. Our own crate keeps full debug info so a debugger can
# inspect variables, not just map backtraces to lines. Incremental rebuild of
# lib.rs: ~2.2s on "line-tables-only" vs ~3.1s here, which is the price of
# being able to actually debug.
[profile.dev]
debug = "full"

[profile.dev.package."*"]
debug = false

# Release is deliberately left at Cargo's defaults (lto = false,
# codegen-units = 16). Most Tauri guides suggest lto = true and
# codegen-units = 1; that would slow CI substantially to buy binary size and
# micro-performance that don't matter for a desktop app shipped on disk.
